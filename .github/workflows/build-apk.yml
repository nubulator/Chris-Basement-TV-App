
name: Build Chris Basement TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Render neon Fire TV launcher artwork
        run: |
          python -m pip install cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='artwork/firetv-banner.svg',write_to='app/src/main/res/drawable/tv_banner.png',output_width=320,output_height=180)
          cairosvg.svg2png(url='artwork/firetv-icon.svg',write_to='app/src/main/res/drawable/tv_icon.png',output_width=256,output_height=256)
          PY

      - name: Build Fire TV APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chris-Basement-TV-APK
          path: app/build/outputs/apk/debug/*.apk
